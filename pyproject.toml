[project]
name = "brew-python-resources"
description = "Generate and Update Homebrew Formula (Brew) Python Resources."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT License" }
authors = [{ name = "Shane" }]
classifiers = [
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "pip>=25.0.1",
  "requests>=2.32.4",
  "requests-cache>=1.2.1",
]
dynamic = ["version"]

[project.urls]
Changelog = "https://github.com/cssnr/brew-python-resources/releases"
Discord = "https://discord.gg/wXy6m2X8wY"
Documentation = "https://cssnr.github.io/brew-python-resources/"
Download = "https://github.com/cssnr/brew-python-resources/releases/latest"
Funding = "https://ko-fi.com/cssnr"
GitHub = "https://github.com/cssnr/brew-python-resources"
Homepage = "https://cssnr.com/"
Issues = "https://github.com/cssnr/brew-python-resources/issues"

[project.scripts]
bpr = "brewresources.cli:main"
brew-python-resources = "brewresources.cli:main"

[dependency-groups]
dev = [
  "bandit>=1.7.10",
  "black>=24.8.0",
  "coverage>=7.6.1",
  "hatch>=1.14.2",
  "isort>=5.13.2",
  "mypy>=1.14.1",
  "pyinstaller>=6.17.0",
  "pyinstaller-versionfile>=2.1.1",
  "pytest>=8.3.5",
  "ruff>=0.14.9",
  "tombi>=0.7.7; python_version>='3.10'",
  "toml-run>=0.0.2",
  "ty>=0.0.7",
  "validate-pyproject[all]>=0.24.1",
  "yamllint>=1.35.1",
]

# https://hatch.pypa.io/latest/config/build/#build-system
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Bandit
# https://bandit.readthedocs.io/en/latest/config.html
[tool.bandit]
exclude_dirs = [".venv"]
skips = ["B105", "B107", "B307", "B404", "B602"]
assert_used = { skips = ["*test_*.py"] }

# Black
# https://black.readthedocs.io/en/stable/usage_and_configuration/
[tool.black]
line-length = 119
extend-exclude = '(\.github)'

# Coverage
# https://coverage.readthedocs.io/en/latest/
[tool.coverage.run]
omit = ["_version.py", "app.py", "utils.py"]
source = ["src"]

# Hatchling
# https://hatch.pypa.io/latest/config/build/#build-system
[tool.hatch.version]
path = "src/brewresources/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/brewresources"]

# Isort
# https://pycqa.github.io/isort/docs/configuration/options.html
[tool.isort]
profile = "black"
lines_after_imports = 2
src_paths = ["src", "test"]
skip = [".venv", ".github"]

# Mypy
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
# ignore_missing_imports = true
exclude = [".venv"]

# Ruff
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 119
target-version = "py313"
extend-exclude = [".github"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q"]

# Scripts
# https://github.com/cssnr/toml-run
[tool.scripts]
win-version = "uv run pyivf-make_version --source-format yaml --metadata-source .github/files/win-version.yaml --outfile win-version.txt"
pyinstaller = "uv run pyinstaller -F -n bpr -i docs/favicon.ico src/app.py"
test = ["uv run coverage run -m pytest", "uv run coverage report -m"]
clean = "rm -rf dist"
build = "uv run hatch build"
predocs = "rm -rf .cache site"
docs = "zensical serve --open --dev-addr 0.0.0.0:8000"
docs-build = "zensical build --clean"
format = """
uv run black .
uv run isort -c .
uv run ruff format
uv run tombi format .
which prettier && prettier --write . || echo missing prettier
"""
lint = """
run bandit
run mypy
run ruff
run validate
run yamllint
which prettier && prettier --check . || echo missing prettier
uv run black --check .
uv run isort -c .
uv run tombi lint .
uv run ty check -v .
uv lock --check
"""
bandit = "uv run bandit -c pyproject.toml -r ."
mypy = "uv run mypy ."
ruff = "uv run ruff check ."
validate = "uv run validate-pyproject pyproject.toml"
yamllint = "uv run yamllint -c .github/yamllint.yaml ."
